<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />

    <title>Frontend Mentor | Intro section with dropdown navigation</title>
  </head>

  <body>
    <nav class="nav">
      <img src="./assets/icons/logo.svg" alt="Snap logo" class="nav__logo" />

      <div class="nav__hamburguer">
        <div class="nav__screen">
          <ul class="nav__menu">
            <li class="nav__item">
              <span class="nav__parent"
                >Features
                <img
                  class="nav__arrow"
                  src="./assets/icons/icon-arrow-down.svg"
                  alt="Flecha baja"
                />
              </span>
              <ul class="nav__inner">
                <li class="nav__dropdown">
                  <img src="./assets/icons/icon-todo.svg" alt="" />
                  <a class="nav__list" href="#">Todo List</a>
                </li>
                <li class="nav__dropdown">
                  <img src="./assets/icons/icon-calendar.svg" alt="" />
                  <a class="nav__list" href="#">Todo List</a>
                </li>

                <li class="nav__dropdown">
                  <img src="./assets/icons/icon-reminders.svg" alt="" />
                  <a class="nav__list" href="#">Todo List</a>
                </li>

                <li class="nav__dropdown">
                  <img src="./assets/icons/icon-planning.svg" alt="" />
                  <a class="nav__list" href="#">Todo List</a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </body>
  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</html>
